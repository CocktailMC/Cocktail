[workspace]
resolver = "2"
members = [
    "crates/cocktail-control",
    "crates/cocktail-init",
    "crates/cocktail-plugin-sdk",
    "crates/plugins/watchdog",
    "crates/plugins/speclint",
    "crates/plugins/gameops",
    "crates/plugins/esplus",
]
default-members = ["crates/cocktail-control"]

[workspace.package]
version = "26.4.11-DP"
edition = "2024"
license = "Apache-2.0"
authors = ["Cocktail"]

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "socks", "multipart"] }
rand_core = "0.6"
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
serde_yaml = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
bollard = { version = "0.21", default-features = false, features = ["chrono", "pipe", "hyperlocal", "hyper-named-pipe", "tokio-stream", "rustls", "rustls-native-certs", "json_data_content"] }
